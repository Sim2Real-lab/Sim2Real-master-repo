{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGN UP | SIM2REAL</title>
  <link rel="stylesheet" href="{% static 'accounts/style.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'assets/sim2real_logo.png' %}">
  <link rel="icon" type="image/png" sizes="16x16" href="{% static 'assets/sim2real_logo.png' %}">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'assets/sim2real_logo.png' %}">
  <link rel="shortcut icon" href="{% static 'assets/sim2real_logo.png' %}">
</head>

<body>
  <div class="overlay"></div>

  <!-- Toast Notifications Container (Fixed Top Right) -->
  <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;">
    {% if signup_error %}
    <div class="toast show align-items-center text-white bg-danger border-0 mb-2 shadow-lg" role="alert"
      aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">
          <i class="fa-solid fa-circle-exclamation me-2"></i>{{ signup_error }}
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
          aria-label="Close"></button>
      </div>
    </div>
    {% endif %}

    {% if signup_info %}
    <div class="toast show align-items-center text-white bg-info border-0 mb-2 shadow-lg" role="alert"
      aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">
          <i class="fa-solid fa-circle-info me-2"></i>{{ signup_info }}
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
          aria-label="Close"></button>
      </div>
    </div>
    {% endif %}

    {% if messages %}
    {% for message in messages %}
    <div class="toast show align-items-center text-white 
      {% if message.tags == 'success' %}bg-success
      {% elif message.tags == 'error' or message.tags == 'danger' %}bg-danger
      {% elif message.tags == 'warning' %}bg-warning
      {% else %}bg-info{% endif %} 
      border-0 mb-2 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">
          <i class="fa-solid 
            {% if message.tags == 'success' %}fa-circle-check
            {% elif message.tags == 'error' or message.tags == 'danger' %}fa-circle-exclamation
            {% elif message.tags == 'warning' %}fa-triangle-exclamation
            {% else %}fa-circle-info{% endif %} me-2"></i>{{ message }}
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
          aria-label="Close"></button>
      </div>
    </div>
    {% endfor %}
    {% endif %}
  </div>

  <div class="login-wrap">
    <div class="login-html">
      <div class="mb-3 text-start">
        <a href="{% url 'landing_page:main_landing_page' %}" class="back-home-btn">
          <i class="fa-solid fa-arrow-left me-2"></i>Home
        </a>
      </div>
      <strong class="page-type" id="type">Sign Up</strong>
      <div class="login-form">
        <form class="sign-up-htm" method="post" action="{% url 'signup' %}">
          {% csrf_token %}
          <div class="group">
            <label for="username" class="label">Email</label>
            <input name="username" id="username" type="text" class="input"
              value="{{ request.POST.username|default:'' }}" required>
          </div>
          <div class="group">
            <label for="password1" class="label">Create Password</label>
            <div class="password-field">
              <input name="password1" id="password1" class="input" type="password" data-type="password" required>
              <span class="toggle-password" data-toggle="#password1"><i class="fa fa-eye"></i></span>
            </div>
          </div>
          <div class="group">
            <label for="password2" class="label">Confirm Password</label>
            <div class="password-field">
              <input name="password2" id="password2" class="input" type="password" data-type="password" required>
              <span class="toggle-password" data-toggle="#password2"><i class="fa fa-eye"></i></span>
            </div>
          </div>
          <div class="group">
            <button id="submit" class="button" value="Sign Up" type="submit">SIGN UP</button>
          </div>
          <div class="hr"></div>
          <div class="foot-lnk">
            <a href="{% url 'login' %}">Already Registered? </a>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/script.js' %}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var toastElList = [].slice.call(document.querySelectorAll('.toast'));
      toastElList.forEach(function (toastEl) {
        new bootstrap.Toast(toastEl, { delay: 6000 }).show();
      });
    });
  </script>
</body>

</html>
