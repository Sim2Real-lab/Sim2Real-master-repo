{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGN UP | SIM2REAL</title>
    <link rel="stylesheet" href="{%static 'accounts/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'assets/sim2real_logo.png' %}">
<link rel="icon" type="image/png" sizes="16x16" href="{% static 'assets/sim2real_logo.png' %}">
<link rel="apple-touch-icon" sizes="180x180" href="{% static 'assets/sim2real_logo.png' %}">
<link rel="shortcut icon" href="{% static 'assets/sim2real_logo.png' %}">

</head>
<body>
<div class="overlay"></div>
<div class="login-wrap">
    <div class="login-html">
        <strong class="page-type" id="type">Sign Up</strong>
        <div class="login-form">
            <form class="sign-up-htm" method="post" action="{% url 'signup' %}">
                {% csrf_token %}
                <div class="group">
                    <label for="username" class="label">Username</label>
                    <input name="username" id="username" type="text" class="input" value="{{ request.POST.username|default:'' }}" required>
                </div>
                <div class="group">
                    <label for="password1" class="label">Create Password</label>
                    <div class="password-field">
                    <input name="password1" id="password1" class="input" type="password" data-type="password">
                    <span class="toggle-password" data-toggle="#password1"><i class="fa fa-eye"></i></span>
                    </div>
                </div>
                <div class="group">
                    <label for="password2" class="label">Confirm Password</label>
                <div class="password-field">
                    <input name="password2" id="password2" class="input" type="password" data-type="password">
                    <span class="toggle-password" data-toggle="#password2"><i class="fa fa-eye"></i></span>
                </div>
                </div>
                <div class="group">
                    <button id="submit" class="button" value="Sign Up" type="submit">SIGN UP</button>
                </div>
                <div class="hr"></div>
                {% if signup_info %}
                    <div class="info-message" style="color: #0c5460; background-color: #d1ecf1; border-color: #bee5eb; padding: 10px; margin-top: 10px; border-radius: 5px; text-align: center;">{{ signup_info }}</div>
                {% endif %}
                {% if signup_error %}
                    <div class="error-message">{{ signup_error }}</div>
                {% endif %}
                <div class="foot-lnk">
                    <a href="{% url 'login' %}">Already Registered? </a>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="{% static 'js/script.js' %}"></script>
</body>
</html>
