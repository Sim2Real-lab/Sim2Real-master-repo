<style>
.box {background:#fff;color:#000;padding:20px;border-radius:8px;}
</style>
<div class="box">
<h2 style="color:black;">Submissions for {{ window.title }}</h2>
<a href="?download=csv" style="color:black;">Download CSV</a>
<table>
  <tr>
    <th>Team</th>
    <th>Link</th>
    <th>Submitted At</th>
  </tr>
  {% for s in submissions %}
  <tr>
    <td>{{ s.team.name }}</td>
    <td><a href="{{ s.link }}" target="_blank">View</a></td>
    <td>{{ s.submitted_at }}</td>
  </tr>
  {% endfor %}
</table></div></div>
