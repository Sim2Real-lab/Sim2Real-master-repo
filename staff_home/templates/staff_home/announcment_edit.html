{% extends 'staff_home/base.html' %}

{% block title %}Edit Announcement | SIM2REAL{% endblock %}

{% block extra_styles %}
<style>
  .edit-announcement-wrapper {
    max-width: 850px;
    margin: 0 auto;
  }
  .edit-card {
    background: #ffffff;
    border: 1px solid #d8e5f5;
    border-radius: 16px;
    box-shadow: 0 4px 18px rgba(15, 55, 110, 0.05);
    padding: 32px;
  }
</style>
{% endblock %}

{% block content %}
<div class="edit-announcement-wrapper">
  
  <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
    <div class="d-flex align-items-center gap-3">
      <a href="{% url 'announcement_list' %}" class="btn btn-outline-secondary btn-sm rounded-pill px-3 fw-semibold">
        <i class="fa-solid fa-arrow-left me-1"></i> Back to Announcements
      </a>
      <h3 class="fw-bold mb-0" style="color: #0b2a5b;">Edit Announcement</h3>
    </div>
  </div>

  <div class="edit-card">
    <form method="post">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-12">
          <label for="id_message" class="form-label fw-semibold text-secondary small">Announcement Message</label>
          <textarea name="message" id="id_message" class="form-control rounded-3" rows="4" required>{{ form.message.value|default:'' }}</textarea>
        </div>
        <div class="col-md-4 col-12">
          <label for="id_category" class="form-label fw-semibold text-secondary small">Target Category</label>
          {{ form.category }}
        </div>
        <div class="col-md-4 col-12">
          <label for="id_valid_till" class="form-label fw-semibold text-secondary small">Valid Till</label>
          <input type="date" name="valid_till" id="id_valid_till" class="form-control rounded-3" value="{{ form.valid_till.value|date:'Y-m-d' }}" required>
        </div>
        <div class="col-md-4 col-12">
          <label for="id_schedule_for_later" class="form-label fw-semibold text-secondary small">Schedule Date</label>
          <input type="date" name="schedule_for_later" id="id_schedule_for_later" class="form-control rounded-3" value="{{ form.schedule_for_later.value|date:'Y-m-d' }}">
        </div>
        <div class="col-12 d-flex justify-content-end gap-2 mt-4">
          <a href="{% url 'announcement_list' %}" class="btn btn-light border px-4 rounded-3 fw-semibold">Cancel</a>
          <button type="submit" class="btn btn-primary px-4 rounded-3 fw-semibold">
            <i class="fa-solid fa-check me-1"></i> Save Changes
          </button>
        </div>
      </div>
    </form>
  </div>

</div>
{% endblock %}
