{% extends "staff_home/base.html" %}
{% block content %}
<div class="container py-4">
  <div class="card shadow-sm border-0 rounded-3">
    <div class="card-body">
      <h2 class="mb-4 text-center">
        {% if action == "Add" %}Add Track{% else %}Edit Track: {{ track.name }}{% endif %}
      </h2>

      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mb-3">
          {{ form.as_p }}
        </div>

        <div class="d-flex justify-content-between">
          <a href="{% url 'manage_problem_statement' %}{% if track %}?track_id={{ track.id }}{% endif %}" class="btn btn-secondary">Back</a>
          <button type="submit" class="btn btn-primary">
            {% if action == "Add" %}Save Track{% else %}Update Track{% endif %}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
